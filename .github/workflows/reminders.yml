# Sends check-in reminders. Runs every hour; the server decides who is due
# (each person gets at most one per day, at the local time they picked).
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SITE_URL     your site's address, e.g. https://what-would-jesus-do.onrender.com
#   CRON_SECRET  the same value as CRON_SECRET on the server
name: Send check-in reminders
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger the send
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL or CRON_SECRET secret not set; skipping."; exit 0; fi
          # --retry covers the free Render plan waking up from sleep (~30s).
          curl -fsS --retry 4 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "${SITE_URL%/}/api/reminders/send"
