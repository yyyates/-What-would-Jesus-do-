# One-click deploy on Render (render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: what-would-jesus-do
    runtime: node
    plan: free             # $0 to start; sleeps when idle (first visit takes ~30s). Change to "starter" (~$7/mo) to stay always on.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false        # Render asks you to paste it privately; it is never stored in the repo
      - key: MODEL
        value: claude-haiku-5-5
      - key: FREE_PER_DAY
        value: "10"
      - key: DAILY_QUESTION_CAP
        value: "2000"
      - key: DONATE_URL
        sync: false
      # Premium (optional until you set up Stripe; see README "Set up Premium with Stripe")
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_YEARLY
        sync: false
      - key: SESSION_SECRET
        generateValue: true   # Render creates a random secret for signing Premium codes
      # Check-in reminders (optional; see README "Set up check-in reminders")
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false
